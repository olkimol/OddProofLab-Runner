name: ODDPROOF Runner Health

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PRIVATE_REPO_TOKEN: ${{ secrets.ODDPROOF_PRIVATE_REPO_TOKEN }}
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_USERNAME: olkimol

    steps:
      - uses: actions/checkout@v4

      - name: Validate required secrets
        run: |
          test -n "$PRIVATE_REPO_TOKEN" || { echo MISSING_ODDPROOF_PRIVATE_REPO_TOKEN; exit 2; }
          test -n "$KAGGLE_API_TOKEN" || { echo MISSING_KAGGLE_API_TOKEN; exit 2; }

      - name: Verify private OddProofLab access
        run: |
          git ls-remote             "https://x-access-token:$PRIVATE_REPO_TOKEN@github.com/olkimol/OddProofLab.git"             refs/heads/oddproof-shorts | tee /tmp/private-ref.txt
          test -s /tmp/private-ref.txt

      - name: Verify Kaggle access
        run: |
          python -m pip install -q -U kaggle
          kaggle --version
          kaggle kernels list --user "$KAGGLE_USERNAME" --page-size 1

      - name: Health result
        run: echo "ODDPROOF_PUBLIC_RUNNER_HEALTH=PASS"
