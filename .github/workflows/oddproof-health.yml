name: ODDPROOF Runner Health

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_USERNAME: olkimol

    steps:
      - uses: actions/checkout@v4

      - name: Validate local executor files
        run: |
          test -f engine/ultrareal-runner.py
          test -f engine/sprint-runner.py
          test -f engine/topic-01-you-never-actually-touch-anything.json
          test -f config/queue.json
          test -f state/published_topics.json

      - name: Validate Kaggle secret
        run: |
          test -n "$KAGGLE_API_TOKEN" || { echo MISSING_KAGGLE_API_TOKEN; exit 2; }

      - name: Verify Kaggle access
        run: |
          python -m pip install -q -U kaggle
          kaggle --version
          kaggle kernels list --user "$KAGGLE_USERNAME" --page-size 1

      - name: Health result
        run: echo "ODDPROOF_PUBLIC_RUNNER_HEALTH=PASS"
